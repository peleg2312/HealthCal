# Supabase project config. Link a project with `supabase link`, then
# `supabase db push` applies migrations and `supabase functions deploy` ships the function.
project_id = "healthcal"

[functions.analyze-food]
# The function verifies the user's token itself so it can return friendly errors.
verify_jwt = false

[functions.food-search]
# Public product data only, but still limited to callers that hold the project's anon key.
verify_jwt = true

[functions.coach-chat]
# The function verifies the user's token itself so it can return friendly errors (as analyze-food).
verify_jwt = false

[functions.billing]
# Off on purpose, for two reasons. The app's actions: the function verifies the user's token itself
# (as analyze-food and coach-chat do) so it can answer with friendly errors. The payment provider's
# webhook (POST /functions/v1/billing/webhook) carries no Supabase token at all: it is verified by the
# provider's signature over the raw body instead, and refused before the body is read without one.
verify_jwt = false
