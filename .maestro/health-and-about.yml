# Workout sync and About on a phone, after first-day.yml has set the app up (no clearState: it
# needs the profile first-day made). It can also be run on its own right after first-day.
#
# Profile > About and its version block first (all HealthCal's own testIDs, so a wrong guess about a
# system screen later cannot cost this evidence); then Profile > Workout sync: the switch, the app's
# own explanation sheet, the system's permission screen (Apple Health's access sheet on an iPhone,
# Health Connect's screen on Android), the sync screen once it is on, Train's steps line.
#
# The system screens are not HealthCal's: they are tapped by their words, every such tap is
# optional, and a screenshot is taken before and after each, so a wrong label shows in the pictures
# and in the hierarchy the workflow saves when a step fails.
#
#   GitHub (free):  Actions > Phone test > Run workflow  (.github/workflows/phone-test.yml)
#   A phone or emulator on your desk:  maestro test .maestro/first-day.yml .maestro/health-and-about.yml
appId: app.healthcal.mobile
name: Workout sync and About on a phone
---
# Start the app again where first-day left it (Today). On Android, launchApp grants every permission
# in the manifest by default, Health Connect's read permissions included (Android 14 and later treat
# them as runtime permissions), which would skip the explanation sheet and the system screen this
# flow is here to see; so this launch denies them. HealthKit has no such switch, so on an iPhone this
# changes nothing for Health.
- launchApp:
    clearState: false
    permissions:
      all: deny
- extendedWaitUntil:
    visible:
      id: today-energy
    timeout: 120000
# A run that crosses midnight (first-day set up yesterday) opens the morning page ("Good morning") over
# Today about a second after the start, between 04:00 and 12:00: close it with its "Today" button
# (morning-today, which closes exactly as the X does; the kit's X is header-close, not a morning testID).
# On the setup day it never opens, so this tap finds nothing and goes on.
- tapOn:
    id: morning-today
    optional: true
- takeScreenshot: 20-today-again

# About: Profile > About and how it works, down to the version block at the foot.
- tapOn:
    id: today-profile
- scrollUntilVisible:
    element:
      id: profile-about
    direction: DOWN
    timeout: 20000
- tapOn:
    id: profile-about
- scrollUntilVisible:
    element:
      id: about-version
    direction: DOWN
    timeout: 60000
# The button under the version line, if this build has updates, sits a little lower.
- scrollUntilVisible:
    element:
      id: about-check-updates
    direction: DOWN
    timeout: 10000
    optional: true
- takeScreenshot: 30-about-version
- assertVisible:
    id: about-update-line
    optional: true
- tapOn:
    id: about-check-updates
    optional: true
- extendedWaitUntil:
    visible:
      id: about-update-status
    timeout: 20000
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 31-about-after-check
- assertVisible:
    id: about-restart
    optional: true

# Back to Today, so the sync part starts from a Profile scrolled to its top.
- tapOn:
    id: header-back
- tapOn:
    id: header-back
- extendedWaitUntil:
    visible:
      id: today-energy
    timeout: 20000

# Profile > Workout sync, still off.
- tapOn:
    id: today-profile
- scrollUntilVisible:
    element:
      id: profile-health-sync
    direction: DOWN
    timeout: 20000
- tapOn:
    id: profile-health-sync
- extendedWaitUntil:
    visible:
      id: health-sync-switch
    timeout: 20000
- takeScreenshot: 21-sync-off

# Turn it on: without permission yet, the app explains first (ExplainSheet), then asks the system.
- tapOn:
    id: health-sync-switch
- extendedWaitUntil:
    visible:
      id: health-sync-continue
    timeout: 15000
    optional: true
- takeScreenshot: 22-explain-sheet
- tapOn:
    id: health-sync-continue
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 23-system-permission-before

# iPhone: Apple Health's access sheet ("Turn On All" at the top of the list, "Allow" at the top right).
- runFlow:
    when:
      platform: iOS
    commands:
      # Since 18 November 2026 the sheet also lists Weight, Body Fat Percentage, Heart Rate and
      # Resting Energy (WEIGHT_READ_TYPES, HEART_READ_TYPES, ENERGY_READ_TYPES). Looked for, never required.
      - assertVisible:
          text: '(?i).*body fat percentage.*'
          optional: true
      - assertVisible:
          text: '(?i).*resting energy.*'
          optional: true
      - tapOn:
          text: '(?i)turn on all.*'
          optional: true
      - takeScreenshot: 24-ios-after-turn-on-all
      - tapOn:
          text: '(?i)allow'
          optional: true
      - waitForAnimationToEnd:
          timeout: 5000
      - takeScreenshot: 25-ios-after-allow

# Android: Health Connect's own screen. The first time on a phone it may show its introduction
# ("Get started") before the permissions ("Allow all", then "Allow").
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          text: '(?i)get started'
          optional: true
      - takeScreenshot: 24-android-permissions
      # Since 18 November 2026 the screen also lists Weight, Body fat and Heart rate (only once
      # app.json declares them). Looked for, never required.
      - assertVisible:
          text: '(?i).*body fat.*'
          optional: true
      - assertVisible:
          text: '(?i).*heart rate.*'
          optional: true
      - tapOn:
          text: '(?i)allow all'
          optional: true
      - takeScreenshot: 25-android-after-allow-all
      - tapOn:
          text: '(?i)allow'
          optional: true
      - waitForAnimationToEnd:
          timeout: 5000
      - takeScreenshot: 26-android-after-allow

# Back in HealthCal: the sync screen once it is on ("Last synced", "Sync now", daily steps).
- extendedWaitUntil:
    visible:
      id: health-sync-now
    timeout: 30000
    optional: true
- takeScreenshot: 27-sync-on
- scrollUntilVisible:
    element:
      id: health-sync-steps
    direction: DOWN
    timeout: 15000
    optional: true
- takeScreenshot: 28-sync-steps-row
# The rows added on 18 November 2026: Weight, Calories burned in a day, Heart rate in workouts. With no
# watch in CI they say "None in …" or "Shown on Progress after 5 full days recorded"; all optional.
- scrollUntilVisible:
    element:
      id: health-sync-weight
    direction: DOWN
    timeout: 15000
    optional: true
- assertVisible:
    id: health-sync-weight
    optional: true
- scrollUntilVisible:
    element:
      id: health-sync-heart
    direction: DOWN
    timeout: 15000
    optional: true
- assertVisible:
    id: health-sync-energy
    optional: true
- assertVisible:
    id: health-sync-heart
    optional: true
- takeScreenshot: 28b-sync-weight-energy-heart-rows

# Train: the week card, where the steps line shows when there are steps (none on a new emulator).
# If a Health Connect screen is still on top (a label guessed wrong), Back leaves it first.
- runFlow:
    when:
      platform: Android
      notVisible:
        id: health-sync-switch
    commands:
      - pressKey: back
      - waitForAnimationToEnd:
          timeout: 3000
- tapOn:
    id: header-back
- tapOn:
    id: header-back
- extendedWaitUntil:
    visible:
      id: today-energy
    timeout: 20000
- tapOn:
    id: tab-train
- extendedWaitUntil:
    visible:
      id: train-week-card
    timeout: 20000
- takeScreenshot: 29-train-week
- assertVisible:
    id: train-steps
    optional: true


# The morning page, opened on purpose (Profile > See yesterday): on a new person's first day its card
# reads "Nothing logged yesterday.", under its greeting header and over its two footer buttons, and "Today" closes it onto Today.
- tapOn:
    id: tab-index
- extendedWaitUntil:
    visible:
      id: today-energy
    timeout: 20000
- tapOn:
    id: today-profile
- scrollUntilVisible:
    element:
      id: profile-morning-open
    direction: DOWN
    timeout: 20000
- takeScreenshot: 32-profile-morning-rows
- tapOn:
    id: profile-morning-open
- extendedWaitUntil:
    visible:
      id: morning-screen
    timeout: 20000
- takeScreenshot: 33-morning-page
- tapOn:
    id: morning-today
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 34-after-morning-today
