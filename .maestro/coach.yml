# The coach on a phone, after first-day.yml has set the app up (no clearState: it needs the profile
# first-day made).
#
# What only a phone shows: the Coach cup in the tab header under a finger, the chat rising from the
# bottom and closing back to the same tab, the field and the send cup riding on the keyboard, a phone
# answer landing as a card, and the chat arriving already answered from the training overview. No
# account is signed in on the test phone, so a typed question gets the app's own line about needing
# an account: no question reaches the AI and nothing is paid for.
#
# The way in and the first view are the required proofs; the rest is best effort, and the pictures
# are the evidence.
#
#   GitHub (free):  Actions > Phone test > Run workflow, flows = first-day,coach
#   A phone or emulator on your desk:  maestro test .maestro/first-day.yml .maestro/coach.yml
appId: app.healthcal.mobile
name: The coach, from every tab
---
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible:
      id: today-energy
    timeout: 120000
# After midnight the morning page may open over Today (see health-and-about.yml).
- tapOn:
    id: morning-today
    optional: true

# Today: the Coach cup is the first of three cups on the right of the header.
- extendedWaitUntil:
    visible:
      id: today-coach-open
    timeout: 20000
- takeScreenshot: 90-today-with-coach-cup
- tapOn:
    id: today-coach-open
- extendedWaitUntil:
    visible:
      id: coach-input
    timeout: 20000
- takeScreenshot: 91-coach-first-view

# A phone answer: free, from the data on the phone, as a card.
- tapOn:
    id: coach-local-training
- extendedWaitUntil:
    visible:
      id: coach-local-answer
    timeout: 15000
- takeScreenshot: 92-coach-training-answer
# The follow-up under it asks the other phone question.
- tapOn:
    id: coach-local-ideas
    optional: true
- takeScreenshot: 93-coach-ideas-answer

# The keyboard: the field and the send cup ride on it.
- tapOn:
    id: coach-input
- inputText: How many rest days a week
- takeScreenshot: 94-coach-keyboard-up
- tapOn:
    id: coach-send
# No account on the test phone: Send keeps the words and opens sign-in. Nothing is sent.
- takeScreenshot: 95-coach-send-opens-sign-in
- tapOn:
    id: header-back
    optional: true
- extendedWaitUntil:
    visible:
      id: coach-input
    timeout: 20000
- takeScreenshot: 95b-coach-words-kept

# The X closes back to Today.
- tapOn:
    id: header-close
- extendedWaitUntil:
    visible:
      id: today-energy
    timeout: 20000

# The diary has the same cup in the same place, and the conversation is still there.
- tapOn:
    id: tab-diary
- extendedWaitUntil:
    visible:
      id: diary-coach-open
    timeout: 20000
- tapOn:
    id: diary-coach-open
- extendedWaitUntil:
    visible:
      id: coach-input
    timeout: 20000
- takeScreenshot: 96-coach-reopened-from-diary
- tapOn:
    id: header-close

# Train: the overview sheet's "Ask the coach" opens the chat already answering.
- tapOn:
    id: tab-train
- tapOn:
    id: train-guideline-help
    optional: true
- tapOn:
    id: train-load-info
    optional: true
- extendedWaitUntil:
    visible:
      id: train-load-sheet
    timeout: 15000
    optional: true
# The sheet itself: the scale under the title, the chart, and "Ask the coach" in its first view.
- takeScreenshot: 96b-training-sheet
- scrollUntilVisible:
    element:
      id: train-load-coach
    direction: DOWN
    timeout: 20000
    optional: true
- tapOn:
    id: train-load-coach
    optional: true
- takeScreenshot: 97-coach-from-training-sheet
